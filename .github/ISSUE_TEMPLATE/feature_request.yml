name: Feature request
description: Suggest an improvement to fleet monitoring or the setup experience.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Check existing requests first. Bitaxe Fleet focuses on monitoring; miner configuration stays in AxeOS. Describe your use case without sharing private fleet information.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe what you are trying to do and where the current dashboard falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or current workaround (optional)
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
      description: For example, approximate fleet size, device types or a sanitised mock-up.
